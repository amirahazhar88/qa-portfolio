name: Playwright Tests
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Start API and database
      working-directory: newsclip/api
      run: docker compose up -d --build

    - name: Wait for API
      run: |
        for i in $(seq 1 60); do
          curl -fs http://localhost:3100/api/health-check && exit 0
          sleep 3
        done
        docker compose -f newsclip/api/docker-compose.yml logs
        exit 1

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: api-tests/requirements.txt

    - name: Run API tests
      working-directory: api-tests
      run: |
        pip install -r requirements.txt
        python -m pytest -q

    - name: Run SQL checks
      run: sql/run_checks.sh

    - name: Start frontend
      working-directory: newsclip/web
      run: |
        cp .env.example .env.local
        npm ci
        nohup npm run serve > ../../vite.log 2>&1 &

    - name: Wait for frontend
      run: |
        for i in $(seq 1 30); do
          curl -fs http://localhost:8080 > /dev/null && exit 0
          sleep 2
        done
        cat vite.log
        exit 1

    - name: Install test dependencies
      working-directory: ui-tests
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: ui-tests
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      working-directory: ui-tests
      run: npm test

    - name: Build the combined Allure report (keeps run history)
      if: ${{ !cancelled() }}
      run: |
        # The history file from the last published report gives the trend graphs; missing on the first run.
        curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-history.jsonl" -o allure-history.jsonl || true
        ui-tests/node_modules/.bin/allure generate allure-results/api allure-results/ui --config allurerc.mjs --clean
        cp allure-history.jsonl allure-report/ || true

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - uses: actions/upload-pages-artifact@v3
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      with:
        path: allure-report/

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: ui-tests/playwright-report/
        retention-days: 30

    - name: Stop API
      if: always()
      working-directory: newsclip/api
      run: docker compose down -v

  # Publishes the Allure report to GitHub Pages (only for pushes to main).
  # Needs Settings > Pages > Source = "GitHub Actions"; until then this job fails
  # without failing the run (continue-on-error).
  publish-report:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
